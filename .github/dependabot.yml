# Adapted example; original is preserved in .github/dependabot.yml.
# dotgithubindexer: docker
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 20
  - package-ecosystem: "docker"
    directory: "/"
    # The builder must match the Distroless runtime's CPython 3.13 ABI.
    # Keep digest/patch updates; interpreter upgrades require a coordinated migration.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 20
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "06:00"
      timezone: "America/New_York"
    groups:
      codeql:
        patterns:
          - "github/codeql-action*"
    open-pull-requests-limit: 20
